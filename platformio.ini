; =============================================================================
; SMART BOX firmware — PlatformIO project file
; Target: Waveshare ESP32-S3-Touch-AMOLED-1.75-B (ESP32-S3R8: 8MB PSRAM, 16MB flash)
; =============================================================================

[platformio]
default_envs = smartbox-esp32s3

[env:smartbox-esp32s3]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi   ; ESP32-S3R8: quad flash / octal PSRAM
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize
upload_speed = 921600

build_flags =
  -D BOARD_HAS_PSRAM
  -D CORE_DEBUG_LEVEL=2
  -D CONFIG_SPIRAM_SUPPORT=1
  -D SMARTBOX_FW_VERSION=\"1.0.0-skeleton\"
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ASYNCWEBSERVER_REGEX   ; required for the "^\/api\/.../([^/]+)$" routes in src/web/WebServer.h
  -I include

lib_deps =
  moononournation/GFX Library for Arduino @ ^1.4.9
  lvgl/lvgl @ ^8.4.0
  bblanchon/ArduinoJson @ ^7.1.0
  ESP32Async/ESPAsyncWebServer @ ^3.6.0
  ESP32Async/AsyncTCP @ ^3.3.2
  miguelbalboa/MFRC522 @ ^1.4.11
  madhephaestus/ESP32Servo @ ^3.0.5
  lewisxhe/SensorLib @ ^0.2.4
  lewisxhe/XPowersLib @ ^0.2.5

extra_scripts =
  pre:tools/inject_version.py
